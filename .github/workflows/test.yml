name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install rasa for GitHub Actions environment (Python 3.10 is compatible)
        pip install rasa>=3.6.0
        
    - name: Debug environment
      working-directory: backend
      run: |
        pip list
        ls -la
        ls -la tests/
        
    - name: Run unit tests
      working-directory: backend
      run: |
        python -m pytest tests/unit/ -v
        
    - name: Run E2E tests with servers
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      working-directory: backend
      run: |
        # Train a model first
        rasa train
        # Start Rasa server in background
        rasa run --enable-api --port 5005 &
        RASA_PID=$!
        # Start Actions server in background
        rasa run actions --debug &
        ACTIONS_PID=$!
        # Give servers time to start
        sleep 30
        # Check if servers are running
        curl http://localhost:5005/ || echo "Rasa server not responding"
        # Run E2E tests
        python -m pytest tests/e2e/test_e2e.py -v
        # Kill background processes
        kill $RASA_PID $ACTIONS_PID || true
        
    - name: Run tests with coverage
      working-directory: backend
      run: |
        python -m pytest tests/ --cov=actions --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: yorkyabroad/rasa-chat-ex       
        file: ./coverage.xml
        fail_ci_if_error: false
        
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
        
    - name: Install dependencies
      working-directory: frontend
      run: npm install
      
    - name: Run unit tests
      working-directory: frontend
      run: npm run test:coverage
      
    - name: Install Playwright browsers
      working-directory: frontend
      run: npx playwright install --with-deps chromium
      
    - name: Run E2E tests
      working-directory: frontend
      run: npm run test:e2e
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 30