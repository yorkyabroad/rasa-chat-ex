version: '3.8'

services:
  rasa-actions:
    build:
      context: ./backend
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    restart: unless-stopped
    mem_limit: 512m

  rasa-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.arm64
    ports:
      - "5005:5005"
    depends_on:
      - rasa-actions
    environment:
      - RASA_ACTION_ENDPOINT=http://rasa-actions:5055/webhook
    restart: unless-stopped
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_RASA_URL=http://${PI_IP}:5005
    ports:
      - "80:80"
    restart: unless-stopped
    mem_limit: 256m

networks:
  default:
    driver: bridge