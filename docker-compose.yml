version: '3.8'

services:
  rasa-actions:
    build:
      context: ./backend
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  rasa-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    depends_on:
      - rasa-actions
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - rasa-server
    restart: unless-stopped

networks:
  default:
    driver: bridge